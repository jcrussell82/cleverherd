<style>
:root{--ink:#112b29;--deep:#162927;--forest:#33564d;--sage:#abbaa5;--sand:#b6a68f;--bone:#e7e2d6;--paper:#f1f0ec;--white:#fbfffe;--line:rgba(17,43,41,.12);--h:'Inter',system-ui,sans-serif;--b:'Montserrat',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--b);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--h);letter-spacing:-.025em;line-height:1.15;margin:0}
p{margin:0}a{color:inherit}
:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
.top{background:var(--deep);color:var(--bone);padding:24px 20px 76px}
.top-in{max-width:728px;margin:0 auto}
[hidden]{display:none!important}
.top img{height:18px;display:block}
.top h1{font-size:clamp(28px,6vw,40px);margin:28px 0 8px;color:var(--white)}
.top p{color:var(--sage);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
.wrap{max-width:760px;margin:-52px auto 0;padding:0 16px 64px;display:grid;gap:20px}
.card{background:var(--white);border:1px solid var(--line);border-radius:22px;padding:28px}
.card h2{font-size:21px;margin-bottom:16px}
.card h4{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--forest);margin:26px 0 8px}
.card h4:first-child{margin-top:0}
.card > p + p{margin-top:10px}
.eyebrow{font:700 11.5px var(--h);letter-spacing:.12em;text-transform:uppercase;color:var(--forest)}
.pill{display:inline-block;font:700 10.5px var(--h);letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:99px;background:var(--bone);color:var(--forest);white-space:nowrap}
.pill.ok{background:var(--forest);color:var(--bone)}.pill.sd{background:var(--sand);color:var(--ink)}.pill.go{background:var(--sage);color:var(--ink)}.pill.bad{background:#f6dcd5;color:#8a2f1f}.pill.ln{background:transparent;border:1px solid rgba(17,43,41,.25)}
.top .pill{background:rgba(231,226,214,.14);color:var(--bone)}.top .pill.sd{background:var(--sand);color:var(--ink)}.top .pill.go{background:var(--sage);color:var(--ink)}.top .pill.ok{background:var(--bone);color:var(--ink)}.top .pill.ln{background:transparent;border:1px solid rgba(231,226,214,.4);color:var(--bone)}
.muted{color:var(--forest)}.small{font-size:13px;line-height:1.55}
.note{font-size:13.5px;line-height:1.55;color:var(--forest);background:var(--paper);border-left:3px solid var(--sand);padding:12px 14px;border-radius:0 12px 12px 0}
.note.test{background:#fff7e6;border-color:#d39b2a;color:#5c4210}
.note.good{background:#eef4ee;border-color:var(--forest);color:var(--ink)}
/* Summary: what it costs and what to do next */
.summary{padding:30px 28px;box-shadow:0 24px 50px -30px rgba(17,43,41,.45)}
.total{font:900 clamp(40px,11vw,54px)/1 var(--h);letter-spacing:-.045em;margin:8px 0 8px}
.sched{list-style:none;padding:0;margin:22px 0 0;border-top:1px solid var(--line)}
.sched li{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.sched .what{flex:1;min-width:0}.sched .what b{display:block;font-family:var(--h);font-size:15px}.sched .what span{font-size:12.5px;color:var(--forest)}
.sched .amt{font:800 16px var(--h);white-space:nowrap}
.next{margin-top:24px}
.next > .eyebrow{display:block;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 14px var(--h);padding:12px 20px;min-height:44px;border-radius:99px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;background:var(--ink);color:var(--bone)}
.btn:hover{background:var(--forest)}.btn:disabled{opacity:.55;cursor:default}
.btn.line{background:transparent;color:var(--ink);border-color:rgba(17,43,41,.3)}
.btn.sm{padding:9px 15px;min-height:40px;font-size:13.5px}
.btn.pay{width:100%;min-height:62px;font-size:19px;letter-spacing:-.01em;border-radius:18px;background:var(--forest);box-shadow:0 14px 30px -14px rgba(17,43,41,.7)}
.btn.pay:hover{background:var(--ink)}
.btn.pay svg{width:20px;height:20px}
.secure{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;color:var(--forest);margin-top:12px;text-align:center}
.form{display:grid;gap:14px;margin-top:4px}
label{font-size:13px;font-weight:600;display:grid;gap:6px}
.in{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(17,43,41,.2);background:var(--white);font:500 15px var(--b);color:var(--ink)}
textarea.in{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:500;font-size:13.5px;line-height:1.5;padding:14px;border-radius:14px;background:var(--paper)}
.check input{margin-top:2px;width:20px;height:20px;flex:none;accent-color:var(--forest)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 180px;min-height:50px;font-size:15px}
.err{color:#8a2f1f;font-weight:600;font-size:13px;display:none}.err.on{display:block}
.row{display:flex;gap:12px 16px;align-items:center;padding:16px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0;padding-top:0}
.grow{flex:1;min-width:0}
.inv .grow{flex:1 1 220px}.inv .end{display:flex;gap:10px;align-items:center;margin-left:auto}
.inv .end b{font:800 16px var(--h)}
.msgs{display:grid;gap:10px;max-height:380px;overflow:auto;margin-bottom:14px}
.msg{max-width:85%;padding:11px 15px;border-radius:16px;background:var(--paper);font-size:14px;line-height:1.5}
.msg.me{justify-self:end;background:var(--forest);color:var(--bone)}
.msg small{display:block;opacity:.7;font-size:11px;margin-top:4px}
.msg-form{display:flex;gap:10px;align-items:flex-end}
.msg-form textarea.in{min-height:48px;height:48px;border-radius:24px;padding:13px 18px;resize:none}
.msg-form .btn{flex:none;min-height:48px}
.stars{display:flex;gap:6px}.stars label{display:inline}.stars input{position:absolute;opacity:0}.stars span{font-size:30px;cursor:pointer;color:var(--bone)}
.stars input:checked~span,.stars label:hover span{color:var(--sand)}
.ms-list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.ms-list li{padding:14px 16px;border-radius:14px;background:var(--paper)}
.ms-list li b{font-family:var(--h)}
.prose{white-space:pre-line;line-height:1.65}
.foot{text-align:center;font-size:12px;line-height:1.8;color:var(--forest);padding:6px 16px 40px}
.foot a{color:inherit}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bone);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;display:none;max-width:calc(100vw - 32px);z-index:9}
.toast.on{display:block}.toast.bad{background:#6e2416}
ul{padding-left:18px;margin:0}
.form > *,.two > *{min-width:0}
input[type=date].in{-webkit-appearance:none;appearance:none;display:block;min-height:46px}
@media (max-width:900px){.in,textarea{font-size:16px}}
@media (max-width:620px){.two{grid-template-columns:1fr}.card{padding:22px 20px;border-radius:20px}.summary{padding:24px 20px}.wrap{gap:16px}.top{padding-bottom:70px}.inv .end{width:100%;justify-content:space-between}}
</style>
</head>

  var store = function(k, v){ try { if (v === undefined) return localStorage.getItem(k) || ''; localStorage.setItem(k, v); } catch (e) { return ''; } };
  function toast(m, bad){ var t = $('#toast'); t.textContent = m; t.className = 'toast on' + (bad ? ' bad' : ''); clearTimeout(toast.t); toast.t = setTimeout(function(){ t.className = 'toast'; }, bad ? 5500 : 3000); }
  function headers(){ var k = CONFIG.supabaseAnonKey, h = {'Content-Type': 'application/json', apikey: k}; if (k.split('.').length === 3) h.Authorization = 'Bearer ' + k; return h; }
  async function rpc(name, args){
    var r = await fetch(CONFIG.supabaseUrl + '/rest/v1/rpc/' + name, {method: 'POST', headers: headers(), body: JSON.stringify(args)});
    var j = await r.json().catch(function(){ return null; });
    if (!r.ok) throw new Error(((j && j.message) || 'Something went wrong').replace(/^[a-z_]+: ?/, '').replace(/^invalid_link$/, 'This link is not valid. Ask the team for a new one.'));
    return j;
  }
  async function pay(invoice){
    var h = headers(); if (!h.Authorization) h.Authorization = 'Bearer ' + CONFIG.supabaseAnonKey;
    var r = await fetch(CONFIG.supabaseUrl + '/functions/v1/payments', {method: 'POST', headers: h, body: JSON.stringify({action: 'checkout', token: TOKEN, invoice_id: invoice})});
    var j = await r.json().catch(function(){ return {}; });
    if (!r.ok) throw new Error(j.error || 'Payments are unavailable right now.');
    return j.url;
  }
  async function run(fn, ok){
    if (busy) return; busy = true; document.body.style.cursor = 'progress';
    try { var res = await fn(); if (res && res.project) { D = res; render(); } if (ok) toast(ok); }
    catch (e) { toast(e.message, true); }
    finally { busy = false; document.body.style.cursor = ''; }
  }
  var STATUS = {proposal_sent: ['Awaiting your review', 'sd'], changes_requested: ['Being updated by the team', ''], approved: ['Approved — payment due', 'sd'], active: ['In progress', 'go'], completed: ['Completed', 'ok'], cancelled: ['Cancelled', 'ln'], draft: ['Being prepared', ''], budget_agreed: ['Being prepared', '']};
  var MS = {planned: ['Planned', ''], in_progress: ['In progress', 'go'], submitted: ['Ready for your review', 'sd'], revision_requested: ['Revision requested', ''], approved: ['Approved', 'ok']};
  var INV = {open: ['Due', 'sd'], processing: ['Processing', ''], paid: ['Paid', 'ok'], failed: ['Payment failed', 'bad'], refunded: ['Refunded', 'ln'], partially_refunded: ['Partly refunded', 'ln'], disputed: ['Disputed', 'bad']};
  var pill = function(map, k){ var v = map[k] || [k, '']; return '<span class="pill ' + v[1] + '">' + esc(v[0]) + '</span>'; };

  var LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  // The payment schedule as a list of steps, each matched to its invoice (if issued).
  function schedule(x){
    var inv = D.invoices, byKind = function(k){ return inv.filter(function(i){ return i.kind === k; })[0]; };
    if (x.payment_plan === 'upfront') return [{t: 'Full payment', d: 'When you approve the proposal', a: x.total_cents, i: byKind('full')}];
    if (x.payment_plan === 'deposit_balance') {
      var dep = Math.round(x.total_cents * (x.deposit_pct || 0) / 100), out = [];
      if (dep) out.push({t: 'Deposit (' + x.deposit_pct + '%)', d: 'When you approve the proposal', a: dep, i: byKind('deposit')});
      out.push({t: dep ? 'Balance' : 'Full payment', d: 'When all milestones are approved', a: x.total_cents - dep, i: byKind('balance') || byKind('full')});
      return out;
    }
    var mi = inv.filter(function(i){ return i.kind === 'milestone'; });
    return (x.milestones || []).map(function(m, k){ return {t: m.title, d: 'When you approve this milestone', a: m.amount_cents, i: mi.filter(function(i){ return i.description.indexOf(m.title) > -1; })[0] || null}; });
  }
  function nextStep(p, pr, test){
    var payable = D.invoices.filter(function(i){ return i.status === 'open' || i.status === 'failed'; })[0];
    var processing = D.invoices.some(function(i){ return i.status === 'processing'; });
    if (payable && D.payments.enabled) return '<div class="next"><span class="eyebrow">Your next step</span>' +
      (payable.status === 'failed' ? '<p class="note" style="margin-bottom:12px">The last payment attempt didn’t go through. You can try again.</p>' : '') +
      '<button class="btn pay" data-pay="' + payable.id + '">' + LOCK + 'Pay ' + money(payable.amount_cents) + '</button>' +
      '<p class="secure">' + esc(payable.description) + ' · Invoice ' + esc(payable.number) + '</p>' +
      '<p class="secure">Card and bank payments are processed securely by Stripe. Cleverherd never sees your card details.</p>' +
      (test ? '<p class="note test" style="margin-top:14px"><b>Test mode.</b> No money is charged. Use card 4242 4242 4242 4242 with any future date and any CVC.</p>' : '') + '</div>';
    if (payable) return '<div class="next"><p class="note">Payment of ' + money(payable.amount_cents) + ' is due. The team will tell you how to pay — online card payment isn’t available for this project yet.</p></div>';
    if (processing) return '<div class="next"><p class="note">Your payment is processing. Bank payments can take a few days to clear; this page will update when it does.</p></div>';
    if (pr && pr.status === 'sent' && p.status === 'proposal_sent') return '<div class="next"><span class="eyebrow">Your next step</span><p style="margin-bottom:14px">Review the proposal below, then approve it or ask for changes.</p>' + decisionForm(p) + '</div>';
    if (p.status === 'completed') return '<div class="next"><p class="note good">This project is complete. Thank you!</p></div>';
    if (p.status === 'active' || p.status === 'approved') return '<div class="next"><p class="note good">You’re all set — nothing is due right now. The team will be in touch as milestones are ready for your review.</p></div>';
    return '';
  }
  function decisionForm(p){
    return '<form class="form" id="approve" novalidate><div class="two"><label>Your full name<input class="in" name="who" autocomplete="name" value="' + esc(store('ch-client-name') || p.client_name) + '" required></label><label>Email<input class="in" name="email" type="email" autocomplete="email" value="' + esc(p.client_email) + '" required></label></div>' +
      '<label class="check"><input type="checkbox" name="agree" required> <span>I approve this proposal' + (p.client_company ? ' on behalf of ' + esc(p.client_company) : '') + ', including the scope, milestones, price of ' + money(p.total_cents) + ' and payment schedule.</span></label>' +
      '<label>Note to the team <small class="muted">(optional)</small><textarea class="in" name="note" maxlength="2000" rows="2"></textarea></label><p class="err" id="approveErr" role="alert"></p>' +
      '<div class="actions"><button class="btn" type="submit">Approve proposal</button><button class="btn line" type="button" id="askChanges">Request changes</button></div>' +
      '<p class="small muted">Your approval, name and the time are recorded as your agreement to this proposal.</p></form>' +
      '<form class="form" id="changes" hidden novalidate><label>What would you like changed?<textarea class="in" name="note" required maxlength="2000"></textarea></label><div class="actions"><button class="btn" type="submit">Send to the team</button><button class="btn line" type="button" id="cancelChanges">Back</button></div></form>';
  }
  function summaryHtml(p, pr, snap, test){
    var x = snap || {total_cents: p.total_cents, fee_pct: p.fee_pct, payment_plan: p.payment_plan, deposit_pct: p.deposit_pct, milestones: D.milestones};
    var rows = schedule(x).map(function(r){ return '<li><div class="what"><b>' + esc(r.t) + '</b><span>' + (r.i && r.i.paid_at ? 'Paid ' + esc(date(r.i.paid_at)) : esc(r.d)) + '</span></div><span class="amt">' + money(r.a) + '</span>' + (r.i ? pill(INV, r.i.status) : '<span class="pill">Later</span>') + '</li>'; }).join('');
    return '<section class="card summary" aria-labelledby="sumh">' +
      (JUST_PAID ? '<p class="note good" style="margin-bottom:18px">Thank you — we’re confirming your payment with Stripe. This page updates automatically.</p>' : THANKS ? '<p class="note good" style="margin-bottom:18px"><b>Payment received.</b> Thank you!</p>' : '') +
      '<span class="eyebrow" id="sumh">Project total</span><div class="total">' + money(x.total_cents) + '</div>' +
      '<p class="small muted">Includes Cleverherd’s ' + x.fee_pct + '% platform fee. No other fees.</p>' +
      '<ul class="sched" aria-label="Payment schedule">' + rows + '</ul>' + nextStep(p, pr, test) + '</section>';
  }
  function proposalHtml(x){
    return (x.summary ? '<p class="prose">' + esc(x.summary) + '</p>' : '') +
      '<h4>Scope of work</h4><p class="prose">' + esc(x.scope || '—') + '</p>' +
      '<h4>Milestones</h4><ul class="ms-list">' + (x.milestones || []).map(function(m){ return '<li><b>' + esc(m.title) + '</b>' + (m.due_date ? ' <span class="small muted">· by ' + esc(date(m.due_date)) + '</span>' : '') + (x.payment_plan === 'milestones' ? ' <span class="small muted">· ' + money(m.amount_cents) + '</span>' : '') + (m.description ? '<div class="small muted" style="margin-top:4px">' + esc(m.description) + '</div>' : '') + '</li>'; }).join('') + '</ul>' +
      (x.timeline ? '<h4>Timeline</h4><p class="prose">' + esc(x.timeline) + '</p>' : '') +
      ((x.roles || []).length ? '<h4>Who’s working on it</h4><p>' + x.roles.map(function(r){ return esc(r.name) + (r.role ? ' (' + esc(r.role) + ')' : ''); }).join(', ') + '</p>' : '') +
      (x.terms ? '<h4>Terms</h4><p class="prose">' + esc(x.terms) + '</p>' : '') +
      (x.valid_until ? '<p class="small muted" style="margin-top:18px">Valid until ' + esc(date(x.valid_until)) + '</p>' : '');
  }
  function render(){
    var p = D.project, pr = D.proposal, snap = pr ? pr.snapshot : null, test = D.payments.mode !== 'live';
    document.title = (p.title || 'Your project') + ' — Cleverherd';
    $('#title').textContent = p.title;
    $('#sub').innerHTML = '<span>From ' + esc(p.team) + ' on Cleverherd</span>' + pill(STATUS, p.status);
    var out = [];
    if (p.status === 'cancelled') out.push('<section class="card"><h2>This project was cancelled</h2><p class="muted">Contact the team if you have questions.</p></section>');
    if (snap || D.invoices.length) out.push(summaryHtml(p, pr, snap, test));
    // Proposal details
    if (snap) {
      var resp = '';
      if (pr.status === 'approved') resp = '<p class="note good" style="margin-top:22px">Approved by ' + esc(pr.responder_name) + ' on ' + esc(date(pr.responded_at)) + '.</p>';
      else if (pr.status === 'changes_requested') resp = '<p class="note" style="margin-top:22px">You asked for changes on ' + esc(date(pr.responded_at)) + '. The team will send an updated proposal.</p>';
      else if (pr.status === 'superseded') resp = '<p class="note" style="margin-top:22px">The team is updating this proposal.</p>';
      out.push('<section class="card" id="proposal"><h2>Proposal' + (pr.version > 1 ? ' <span class="small muted">(version ' + pr.version + ')</span>' : '') + '</h2>' + proposalHtml(snap) + resp + '</section>');
    } else if (p.status !== 'cancelled') out.push('<section class="card"><h2>Your proposal is being prepared</h2><p class="muted">You’ll be able to review it here soon.</p></section>');
    // Invoices
    if (D.invoices.length) {
      out.push('<section class="card"><h2>Invoices</h2>' + D.invoices.map(function(i){
        return '<div class="row inv"><div class="grow"><b>' + esc(i.description) + '</b><div class="small muted">Invoice ' + esc(i.number) + ' · issued ' + esc(date(i.issued_at)) + (i.due_date && i.status === 'open' ? ' · due ' + esc(date(i.due_date)) : '') + (i.paid_at ? ' · paid ' + esc(date(i.paid_at)) : '') + '</div></div><div class="end"><b>' + money(i.amount_cents) + '</b>' + pill(INV, i.status) + '</div></div>';
      }).join('') + '</section>');
    }
    // Milestones
    if (['approved', 'active', 'completed'].indexOf(p.status) > -1 && D.milestones.length) {
      out.push('<section class="card"><h2>Milestones</h2>' + D.milestones.map(function(m){
        return '<div class="row" style="align-items:flex-start"><div class="grow"><b>' + esc(m.title) + '</b> ' + pill(MS, m.status) + '<div class="small muted" style="margin-top:4px">' + (m.due_date ? 'Due ' + esc(date(m.due_date)) : '') + (m.approved_at ? ' · approved ' + esc(date(m.approved_at)) : '') + '</div>' +
          (m.deliverables.length ? '<ul style="margin-top:10px">' + m.deliverables.map(function(d){ return '<li>' + (d.url ? '<a href="' + esc(d.url) + '" target="_blank" rel="noopener noreferrer">' + esc(d.title) + ' ↗</a>' : esc(d.title)) + (d.note ? ' — <span class="small muted">' + esc(d.note) + '</span>' : '') + '</li>'; }).join('') + '</ul>' : '') +
          (m.status === 'revision_requested' ? '<p class="small muted" style="margin-top:8px">You asked: “' + esc(m.revision_note) + '”</p>' : '') +
          (m.status === 'submitted' ? '<form class="form ms" data-id="' + m.id + '" novalidate style="margin-top:14px"><label>Feedback <small class="muted">(required if requesting a revision)</small><textarea class="in" name="note" rows="2" maxlength="2000"></textarea></label><div class="actions"><button class="btn" type="submit" name="d" value="approve">Approve milestone</button><button class="btn line" type="submit" name="d" value="revise">Request a revision</button></div></form>' : '') +
          '</div></div>';
      }).join('') + '</section>');
    }
    // Messages
    if (p.status !== 'cancelled') {
      out.push('<section class="card"><h2>Messages with the team</h2><div class="msgs">' + (D.messages.length ? D.messages.map(function(m){ return '<div class="msg ' + (m.from_client ? 'me' : '') + '"><b class="small">' + esc(m.name) + '</b><br>' + esc(m.body) + '<small>' + esc(date(m.created_at)) + '</small></div>'; }).join('') : '<p class="small muted">No messages yet. Questions about the proposal or the work? Write to the team here.</p>') + '</div>' +
        '<form class="msg-form" id="msg" novalidate><textarea class="in" name="body" rows="1" maxlength="4000" placeholder="Write to the team…" aria-label="Message" required></textarea><button class="btn" type="submit">Send</button></form></section>');
    }
    // Feedback
    if (p.status === 'completed') {
      var f = D.feedback;
      out.push('<section class="card"><h2>How did it go?</h2>' + (f ? '<p style="margin-bottom:10px">Thanks for your feedback (' + '★'.repeat(f.rating) + ').</p>' : '') + '<form class="form" id="fb" novalidate><div class="stars" role="radiogroup" aria-label="Rating">' + [1, 2, 3, 4, 5].map(function(n){ return '<label><input type="radio" name="rating" value="' + n + '"' + (f && f.rating === n ? ' checked' : '') + '><span aria-label="' + n + ' stars">★</span></label>'; }).join('') + '</div><label>Comments<textarea class="in" name="comment" maxlength="2000">' + esc(f ? f.comment : '') + '</textarea></label><label class="check"><input type="checkbox" name="publish"' + (f && f.publish ? ' checked' : '') + '> <span>The team may show my rating and comment on their Cleverherd profiles, with my first name.</span></label><div><button class="btn" type="submit">' + (f ? 'Update feedback' : 'Send feedback') + '</button></div></form></section>');
    }
    $('#main').innerHTML = out.join('');
    bind();
  }
  function bind(){
    var ap = $('#approve'), ch = $('#changes');
    if (ap) {
      ap.addEventListener('submit', function(e){ e.preventDefault(); var d = new FormData(ap), err = $('#approveErr');
        if (!String(d.get('who') || '').trim()) { err.textContent = 'Type your full name.'; err.className = 'err on'; return; }
        if (!d.get('agree')) { err.textContent = 'Tick the box to confirm your approval.'; err.className = 'err on'; return; }
        store('ch-client-name', String(d.get('who')).trim());
        run(function(){ return rpc('client_respond_proposal', {t: TOKEN, v: D.proposal.version, approve: true, who: d.get('who'), email: d.get('email'), note: d.get('note') || ''}); }, 'Approved — thank you!');
      });
      $('#askChanges').addEventListener('click', function(){ ap.hidden = true; ch.hidden = false; ch.querySelector('textarea').focus(); });
      $('#cancelChanges').addEventListener('click', function(){ ch.hidden = true; ap.hidden = false; });
      ch.addEventListener('submit', function(e){ e.preventDefault(); var note = new FormData(ch).get('note'); if (String(note || '').trim().length < 3) { toast('Tell the team what to change.', true); return; }
        run(function(){ return rpc('client_respond_proposal', {t: TOKEN, v: D.proposal.version, approve: false, who: store('ch-client-name') || D.project.client_name, email: D.project.client_email, note: note}); }, 'Sent — the team will update the proposal');
      });
    }
    document.querySelectorAll('[data-pay]').forEach(function(b){ b.addEventListener('click', async function(){ var label = b.innerHTML; b.disabled = true; b.textContent = 'Opening secure checkout…'; try { location.href = await pay(b.dataset.pay); } catch (e) { b.disabled = false; b.innerHTML = label; toast(e.message, true); } }); });
    var mt = document.querySelector('#msg textarea'); if (mt) mt.addEventListener('input', function(){ mt.style.height = '48px'; mt.style.height = Math.min(mt.scrollHeight + 3, 180) + 'px'; });
    document.querySelectorAll('form.ms').forEach(function(f){ f.addEventListener('submit', function(e){ e.preventDefault(); var approve = (e.submitter && e.submitter.value) !== 'revise', note = new FormData(f).get('note') || '';
      if (!approve && String(note).trim().length < 3) { toast('Describe what needs to change.', true); return; }
      run(function(){ return rpc('client_milestone_decision', {t: TOKEN, m: f.dataset.id, approve: approve, who: store('ch-client-name') || D.project.client_name, note: note}); }, approve ? 'Milestone approved' : 'Revision requested');
    }); });
    var mf = $('#msg'); if (mf) mf.addEventListener('submit', function(e){ e.preventDefault(); var body = String(new FormData(mf).get('body') || '').trim(); if (!body) return;
      run(function(){ return rpc('client_message', {t: TOKEN, who: store('ch-client-name') || D.project.client_name || 'Client', body: body}); }, 'Message sent'); });
    var fb = $('#fb'); if (fb) fb.addEventListener('submit', function(e){ e.preventDefault(); var d = new FormData(fb); if (!d.get('rating')) { toast('Choose a rating.', true); return; }
      run(function(){ return rpc('client_feedback', {t: TOKEN, rating: +d.get('rating'), comment: d.get('comment') || '', publish: !!d.get('publish'), who: (store('ch-client-name') || D.project.client_name || '').split(' ')[0]}); }, 'Thank you!'); });
  }
  // Ask the payment service to check with Stripe directly (backup for slow or missing webhooks).
  async function sync(){
    try {
      var h = headers(); if (!h.Authorization) h.Authorization = 'Bearer ' + CONFIG.supabaseAnonKey;
      var r = await fetch(CONFIG.supabaseUrl + '/functions/v1/payments', {method: 'POST', headers: h, body: JSON.stringify({action: 'sync', token: TOKEN})});
      var j = await r.json().catch(function(){ return {}; });
      return r.ok ? (j.updated || 0) : 0;
    } catch (e) { return 0; }
  }
  var unsettled = function(){ return D && D.invoices.some(function(i){ return i.status === 'open' || i.status === 'processing' || i.status === 'failed'; }); };
  async function refresh(){ try { D = await rpc('client_portal', {t: TOKEN}); render(); } catch (e) {} }
  async function load(){
    if (!CONFIG.supabaseUrl) { $('#sub').textContent = 'This page isn’t connected yet.'; return; }
    if (!TOKEN) { $('#sub').textContent = 'Open this page using the link from your project team.'; return; }
    try { D = await rpc('client_portal', {t: TOKEN}); render(); }
    catch (e) { $('#title').textContent = 'Link not valid'; $('#sub').textContent = e.message; return; }
    if (JUST_PAID) {
      // Back from Stripe: check with Stripe straight away, then keep checking for about a minute.
      var waits = [0, 2500, 4000, 6000, 8000, 10000, 15000, 15000], n = 0;
      var step = async function(){
        if (await sync()) await refresh(); else await refresh();
        n++;
        if (!unsettled() || n >= waits.length) { THANKS = !unsettled(); JUST_PAID = false; history.replaceState(null, '', location.pathname + '#t=' + TOKEN); render(); return; }
        setTimeout(step, waits[n]);
      };
      step();
    } else if (D.payments.enabled && unsettled()) {
      if (await sync()) await refresh();   // e.g. the client closed Stripe's page before it redirected back
    }
  }
  load();
})();
</script>
</body>
</html>
